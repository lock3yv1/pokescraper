name: PokeScraper

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to press "Run Workflow" manually

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Removed the cache line to prevent the "lock file not found" error

      - name: Install Dependencies
        run: |
          npm install
          # Explicitly installing everything in case your package.json is incomplete
          npm install cheerio axios dotenv node-fetch

      - name: Run Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js
