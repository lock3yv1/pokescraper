name: PokeScraper 2026 Pro

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Files
        run: ls -R # Logs exactly what files are in your repo for debugging

      - name: Install Dependencies
        run: npm install node-fetch cheerio

      - name: Run Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f index.js ]; then
            node index.js
          else
            echo "::error::index.js not found! Ensure it is in the root directory."
            exit 1
          fi
