name: PokeScraper

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Reduced to 5 as scraping shouldn't take longer
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # This enables automatic caching of your npm dependencies
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          # Explicitly ensuring these exist even if not in package.json
          npm install cheerio dotenv node-fetch

      - name: Run Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js
